name: Java CI with Maven

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  # ── Job 1: Unit Tests — fast gate (~60s) ─────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "zulu"
          cache: "maven"

      - name: Run Unit Tests
        run: ./mvnw -B clean test -Dspotless.check.skip=true --file pom.xml

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      # Upload the .exec binary so the coverage gate can merge it with IT data
      - name: Upload Unit Test Coverage Data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-unit-exec
          path: target/jacoco.exec
          retention-days: 1

  # ── Job 2: Integration Tests — Testcontainers (~5 min) ───────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "zulu"
          cache: "maven"

      - name: Check Docker Resources
        run: docker info | grep -E "Memory|CPUs"

      # Authenticate to Docker Hub to avoid anonymous pull rate limits.
      # Set DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD as repository secrets.
      - name: DockerHub Login
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # Pre-pull the Fineract image — fail early if the image is unavailable
      - name: Pre-pull Fineract Image
        run: docker pull apache/fineract:develop

      # -Dsurefire.skip=true: compile + run only Failsafe, don't re-run unit tests
      - name: Run Integration Tests
        run: ./mvnw -B clean package verify -Dspotless.check.skip=true -Dsurefire.skip=true --file pom.xml

      - name: Upload Failsafe Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          retention-days: 7

      # Upload the IT .exec binary for the coverage merge step
      - name: Upload Integration Test Coverage Data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-it-exec
          path: target/jacoco-it.exec
          retention-days: 1

      # Dump Docker state and Fineract container logs on failure for diagnostics
      - name: Dump Docker state and Fineract logs on failure
        if: failure()
        run: |
          echo "=== docker info ==="
          docker info || true
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== Docker logs for apache/fineract containers ==="
          for id in $(docker ps -a -q --filter ancestor=apache/fineract:develop); do
            echo "=== logs for container $id ==="
            docker logs "$id" || true
          done
        continue-on-error: true

  # ── Job 3: Coverage Gate — merges both .exec files before enforcing ───────
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "zulu"
          cache: "maven"

      # Download both .exec files produced in the previous two jobs
      - name: Download Unit Test Coverage Data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jacoco-unit-exec
          path: target/

      - name: Download Integration Test Coverage Data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jacoco-it-exec
          path: target/

      # Compile is required so JaCoCo can map bytecode back to source lines
      - name: Compile (no tests)
        run: ./mvnw -B compile -Dspotless.check.skip=true --file pom.xml

      # jacoco:merge reads all *.exec in target/, writes target/jacoco-merged.exec
      # jacoco:report generates the human-readable HTML from the merged data
      # jacoco:check enforces the ratchet thresholds (see pom.xml enforce-coverage execution)
      - name: Merge Coverage Data and Enforce Thresholds
        run: |
          ./mvnw -B jacoco:merge@merge-results jacoco:report@report-merged jacoco:check@enforce-coverage \
            -Djacoco.dataFile=target/jacoco-merged.exec \
            -Dspotless.check.skip=true \
            --file pom.xml

      - name: Upload Merged Coverage Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-merged-report
          path: target/site/jacoco-merged/
          retention-days: 14
