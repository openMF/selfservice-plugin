# =============================================================================
# Nginx configuration for Mifos Self Service Plugin documentation
# Serves the Astro + Starlight static site at https://docs.mifos.community
# Full nginx.conf (replaces /etc/nginx/nginx.conf) — non-root friendly.
#
# NOTE: nginx's add_header inheritance rule means that if a location block
# contains ANY add_header directive, it does NOT inherit add_header from
# the http or server level. Security headers are therefore repeated in
# every location block that sets its own headers.
# =============================================================================

# PID file in /tmp (writable by non-root user)
pid /tmp/nginx.pid;

worker_processes auto;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Shared security header set (repeated in each location that uses add_header)
    # Stored as a macro-like comment; must be copied verbatim into each location.
    # SECURITY_HEADERS:
    #   add_header X-Frame-Options "DENY" always;
    #   add_header X-Content-Type-Options "nosniff" always;
    #   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #   add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    #   add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self';" always;

    # -------------------------------------------------------------------------
    # Server
    # -------------------------------------------------------------------------
    server {
        listen 8080;
        server_name docs.mifos.community localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Apply security headers at server level too (inherited by locations
        # that do NOT have their own add_header)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self';" always;

        # ---------------------------------------------------------------------
        # Caching
        # ---------------------------------------------------------------------
        # HTML files: short cache, revalidate
        location = / {
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self';" always;
            add_header Cache-Control "public, max-age=60, must-revalidate" always;
            try_files $uri /index.html;
        }

        # All HTML pages — short cache so content updates propagate quickly
        location ~* \.html$ {
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self';" always;
            add_header Cache-Control "public, max-age=60, must-revalidate" always;
        }

        # Hashed static assets (JS, CSS, images, fonts) — long cache
        # Starlight assets live under /_astro/ with content hashes in filenames
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self';" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # Pagefind search assets — cache for a reasonable duration
        location ~* /pagefind/ {
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self';" always;
            add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        }

        # ---------------------------------------------------------------------
        # SPA / Starlight routing
        # ---------------------------------------------------------------------
        location / {
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self';" always;
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------------------------
        # Custom 404 page (Starlight generates dist/404.html)
        # ---------------------------------------------------------------------
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # ---------------------------------------------------------------------
        # Healthcheck endpoint
        # ---------------------------------------------------------------------
        location /healthz {
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self';" always;
            access_log off;
            return 200 "ok\n";
            add_header Content-Type "text/plain" always;
        }

        # Deny access to hidden files and dot-directories
        location ~ /\. {
            deny all;
        }

        # Deny access to common source/config files
        location ~* \.(env|gitignore|md|mdx|toml|yaml|yml|lock)$ {
            deny all;
        }
    }
}
