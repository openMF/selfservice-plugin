info:
  name: 03. APPROVE TRANSFER (with step-up token)
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/fineract-provider/api/v1/self/accounttransfers/approvals/{{approvalId}}?command=approve
  headers:
    - name: Fineract-Platform-TenantId
      value: default
    - name: Authorization
      value: Basic {{sessionKey}}
    - name: X-Step-Up-Token
      value: "{{stepUpToken}}"
  params:
    - name: command
      value: approve
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
