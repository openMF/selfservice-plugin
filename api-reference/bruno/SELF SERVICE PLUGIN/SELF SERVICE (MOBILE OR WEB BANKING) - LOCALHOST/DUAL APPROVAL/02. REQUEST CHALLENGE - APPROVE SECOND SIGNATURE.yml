info:
  name: 02. REQUEST CHALLENGE - APPROVE SECOND SIGNATURE
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/fineract-provider/api/v1/self/stepup/challenges
  headers:
    - name: Fineract-Platform-TenantId
      value: default
    - name: Authorization
      value: Basic {{sessionKey}}
  body:
    type: json
    data: |-
      {
          "action": "APPROVE_SECOND_SIGNATURE",
          "channel": "EMAIL",
          "payload": {
              "approvalId": {{approvalId}}
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
