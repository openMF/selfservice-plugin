info:
  name: 04. REJECT TRANSFER
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8080/fineract-provider/api/v1/self/accounttransfers/approvals/{{approvalId}}?command=reject
  headers:
    - name: Fineract-Platform-TenantId
      value: default
    - name: Authorization
      value: Basic {{sessionKey}}
  params:
    - name: command
      value: reject
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
