info:
  name: 02. LIST MY ACTIVITY (PAGE AND FILTER)
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/fineract-provider/api/v1/self/activity?limit=10&offset=0&type=LOGIN,TRANSFER_CONFIRMED
  headers:
    - name: Fineract-Platform-TenantId
      value: default
    - name: Authorization
      value: Basic {{sessionKey}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
