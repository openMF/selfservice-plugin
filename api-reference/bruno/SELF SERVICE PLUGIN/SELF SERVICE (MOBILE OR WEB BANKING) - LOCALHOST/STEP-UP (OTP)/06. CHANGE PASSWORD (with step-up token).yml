info:
  name: 06. CHANGE PASSWORD (with step-up token)
  type: http
  seq: 7

http:
  method: PUT
  url: http://localhost:8080/fineract-provider/api/v1/self/user
  headers:
    - name: Fineract-Platform-TenantId
      value: default
    - name: Authorization
      value: Basic {{sessionKey}}
    - name: X-Step-Up-Token
      value: "{{stepUpToken}}"
  body:
    type: json
    data: |-
      {
          "password": "REPLACE_ME",
          "repeatPassword": "REPLACE_ME"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
