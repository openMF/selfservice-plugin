info:
  name: 01. STEP-UP CONFIG
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/fineract-provider/api/v1/self/stepup/config
  headers:
    - name: Fineract-Platform-TenantId
      value: default
    - name: Authorization
      value: Basic {{sessionKey}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
