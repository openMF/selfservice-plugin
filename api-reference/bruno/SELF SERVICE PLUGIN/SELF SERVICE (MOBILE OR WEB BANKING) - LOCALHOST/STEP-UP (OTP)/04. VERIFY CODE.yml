info:
  name: 04. VERIFY CODE
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8080/fineract-provider/api/v1/self/stepup/challenges/{{challengeId}}/verify
  headers:
    - name: Fineract-Platform-TenantId
      value: default
    - name: Authorization
      value: Basic {{sessionKey}}
  body:
    type: json
    data: |-
      {
          "otp": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
