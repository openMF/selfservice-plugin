info:
  name: 13. AUTHENTICATOR - NEW RECOVERY CODES (with step-up token)
  type: http
  seq: 14

http:
  method: POST
  url: http://localhost:8080/fineract-provider/api/v1/self/stepup/totp/recovery-codes
  headers:
    - name: Fineract-Platform-TenantId
      value: default
    - name: Authorization
      value: Basic {{sessionKey}}
    - name: X-Step-Up-Token
      value: "{{stepUpToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
