info:
  name: 03. REQUEST CHALLENGE - CHANGE PASSWORD
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/fineract-provider/api/v1/self/stepup/challenges
  headers:
    - name: Fineract-Platform-TenantId
      value: default
    - name: Authorization
      value: Basic {{sessionKey}}
  body:
    type: json
    data: |-
      {
          "action": "CHANGE_PASSWORD",
          "channel": "EMAIL"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
