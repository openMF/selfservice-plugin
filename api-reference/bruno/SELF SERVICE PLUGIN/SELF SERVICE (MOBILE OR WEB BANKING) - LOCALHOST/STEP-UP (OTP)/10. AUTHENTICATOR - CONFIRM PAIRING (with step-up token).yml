info:
  name: 10. AUTHENTICATOR - CONFIRM PAIRING (with step-up token)
  type: http
  seq: 11

http:
  method: POST
  url: http://localhost:8080/fineract-provider/api/v1/self/stepup/totp/enrollment/confirm
  headers:
    - name: Fineract-Platform-TenantId
      value: default
    - name: Authorization
      value: Basic {{sessionKey}}
    - name: X-Step-Up-Token
      value: "{{stepUpToken}}"
  body:
    type: json
    data: |-
      {
          "code": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
