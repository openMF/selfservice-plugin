info:
  name: 02. REQUEST CHALLENGE - THIRD PARTY TRANSFER
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/fineract-provider/api/v1/self/stepup/challenges
  headers:
    - name: Fineract-Platform-TenantId
      value: default
    - name: Authorization
      value: Basic {{sessionKey}}
  body:
    type: json
    data: |-
      {
          "action": "TPT_TRANSFER",
          "channel": "EMAIL",
          "payload": {
              "fromAccountId": 1,
              "fromAccountType": 2,
              "toAccountId": 2,
              "toAccountType": 2,
              "transferAmount": 15.36
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
